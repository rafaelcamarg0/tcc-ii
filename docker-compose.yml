name: tcc_pld_revisao

services:
  postgres:
    image: postgres:17
    env_file:
      - .env
    volumes:
      - tcc_pld_data:/var/lib/postgresql/data
      - ./sql/001_BASE_TCC.sql:/docker-entrypoint-initdb.d/001_BASE_TCC.sql:ro
      - ./sql/003_REGRA_R01.sql:/docker-entrypoint-initdb.d/003_REGRA_R01.sql:ro
      - ./sql/005_GERADOR_BASE_SINTETICA.sql:/docker-entrypoint-initdb.d/005_GERADOR_BASE_SINTETICA.sql:ro
      - ./sql/008_CENARIOS_CONTROLADOS_R01.sql:/docker-entrypoint-initdb.d/008_CENARIOS_CONTROLADOS_R01.sql:ro
      - ./sql/013_CENARIOS_NEGATIVOS_R01.sql:/docker-entrypoint-initdb.d/013_CENARIOS_NEGATIVOS_R01.sql:ro
      - ./sql/021_CONSULTA_ALERTAS.sql:/docker-entrypoint-initdb.d/021_CONSULTA_ALERTAS.sql:ro
      - ./sql:/sql:ro
      - ./tests:/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 45

volumes:
  tcc_pld_data:
